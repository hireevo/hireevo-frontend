name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build-time values for the checks below. Production values are configured on
  # the deployment, not here. The API URL is the origin only — the /api/v1
  # prefix is part of the generated client, and env.ts now rejects a path, so a
  # doubled prefix fails the build instead of being masked by the e2e mocks.
  NEXT_PUBLIC_API_URL: http://localhost:3000
  NEXT_PUBLIC_SITE_URL: http://localhost:3100

jobs:
  verify:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: The generated API client still matches the pinned spec
        # Ahead of the other checks: a hand-edited client makes everything after
        # it compile against a shape the API does not return, and the failure
        # would show up somewhere far from its cause.
        run: pnpm --filter @hireevo/api-client check:drift

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Unit tests and coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  end-to-end:
    name: End to end, accessibility and headers
    runs-on: ubuntu-latest
    # Three engines' worth of browsers to install and a responsive suite that
    # runs on each of them.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Keyed on the pinned Playwright version so a browser upgrade invalidates
      # the cache instead of running against a stale binary.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}

      - name: Install Playwright browsers
        run: pnpm --filter @hireevo/e2e install-browsers

      - name: Build the app the tests run against
        run: pnpm build

      - name: End to end
        run: pnpm e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  container:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
