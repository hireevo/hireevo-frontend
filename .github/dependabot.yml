version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # One pull request per group rather than fifteen. Anything with a known CVE
    # still arrives on its own, immediately, because security updates are not
    # grouped by Dependabot.
    groups:
      next:
        patterns: ['next', '@next/*', 'eslint-config-next']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      tooling:
        patterns: ['eslint*', 'prettier', 'typescript*', '@typescript-eslint/*', 'turbo']
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/*', '@testing-library/*', 'jsdom']
    ignore:
      # TypeScript 7 cannot be taken yet, and a grouped bump that carries it
      # takes three harmless patch updates down with it every week.
      # `check:drift` regenerates the API client from openapi.json and compares
      # it with the pinned spec; the generator is openapi-typescript@7.13.0,
      # the newest published, and it still declares `typescript: ^5.x` as its
      # peer. Under 7 it exits non-zero before it writes anything, so the
      # comparison the contract pin depends on cannot run at all.
      # Remove this the day openapi-typescript supports TypeScript 7, and
      # upgrade TypeScript in a change of its own rather than inside a group.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly
